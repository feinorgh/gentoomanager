[ansible]

# CI policy: keep broad coverage, but only run Python/Ansible pairs that are
# currently supported by ansible-core release windows.
#
# Unsupported combinations are excluded via substring match over generated
# environment names (tox-ansible behavior).
skip =
    py3.7
    py3.8
    2.9
    2.10
    2.11
    2.12
    2.13
    py3.14-2.16
    py3.13-2.16
    py3.12-2.16
    py3.14-2.17
    py3.13-2.17
    py3.14-2.18
    py3.10-2.18
    py3.14-2.19
    py3.10-2.19
    py3.11-2.20
    py3.10-2.20
    py3.11-2.21
    py3.10-2.21
    py3.10-milestone
    py3.11-milestone
    py3.14-milestone
    py3.10-devel
    py3.11-devel
    py3.12-devel
    py3.14-devel
