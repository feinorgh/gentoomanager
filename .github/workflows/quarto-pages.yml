---
name: Quarto Pages

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/benchmarks-article/**"
      - "scripts/benchmarks_article_data.py"
      - "scripts/benchmarks_article_hosts.py"
      - "benchmarks/results/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quarto-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies for article rendering
        run: >-
          python -m pip install --upgrade pip &&
          pip install jupyter pandas numpy plotly

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate host detail pages
        run: |
          if [ -d benchmarks/results ]; then
            python scripts/benchmarks_article_hosts.py \
              --results benchmarks/results \
              --output docs/benchmarks-article/hosts
          else
            echo "benchmarks/results not found; skipping host-page generation and using committed host pages."
          fi

      - name: Render Quarto project
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: docs/benchmarks-article

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/benchmarks-article/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
