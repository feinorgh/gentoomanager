---
# FreeBSD poudriere backend: bulk-build and install from the selected pkg set.

- name: Ensure ports tree is available and up to date
  ansible.builtin.git: # noqa: latest[git]
    repo: https://git.FreeBSD.org/ports.git
    dest: /usr/ports
    depth: 1
    update: true
    force: true
  become: true
  failed_when: false

- name: Validate poudriere repository configuration for selected set
  ansible.builtin.command:
    cmd: pkg -vv
  register: provision_benchmarks_freebsd_poudriere_repo_validation
  changed_when: false
  failed_when: >-
    _provision_benchmarks_freebsd_poudriere_repo_fragment
    not in (provision_benchmarks_freebsd_poudriere_repo_validation.stdout | default(''))
  become: true

- name: Preflight benchmark dependency set with poudriere bulk dry-run
  ansible.builtin.command:
    cmd: >-
      poudriere bulk -n
      -j {{ provision_benchmarks_freebsd_poudriere_jail }}
      -p {{ provision_benchmarks_freebsd_poudriere_ports_tree }}
      {% if _provision_benchmarks_freebsd_poudriere_set_effective | length > 0 %}-z {{ _provision_benchmarks_freebsd_poudriere_set_effective }}{% endif %}
      {{ _provision_benchmarks_freebsd_origins | join(' ') }}
  register: provision_benchmarks_freebsd_poudriere_preflight
  become: true
  changed_when: false
  failed_when: false

- name: Attempt to stop a stale running poudriere jail before retrying preflight
  ansible.builtin.command:
    cmd: >-
      poudriere jail -k
      -j {{ provision_benchmarks_freebsd_poudriere_jail }}
      -p {{ provision_benchmarks_freebsd_poudriere_ports_tree }}
      {% if _provision_benchmarks_freebsd_poudriere_set_effective | length > 0 %}-z {{ _provision_benchmarks_freebsd_poudriere_set_effective }}{% endif %}
  register: provision_benchmarks_freebsd_poudriere_stop_jail
  become: true
  changed_when: provision_benchmarks_freebsd_poudriere_stop_jail.rc == 0
  failed_when: false
  when:
    - provision_benchmarks_freebsd_poudriere_preflight.rc != 0
    - "'jail already running' in (provision_benchmarks_freebsd_poudriere_preflight.stderr | default(''))"

- name: Retry poudriere bulk dry-run preflight after stale jail stop attempt
  ansible.builtin.command:
    cmd: >-
      poudriere bulk -n
      -j {{ provision_benchmarks_freebsd_poudriere_jail }}
      -p {{ provision_benchmarks_freebsd_poudriere_ports_tree }}
      {% if _provision_benchmarks_freebsd_poudriere_set_effective | length > 0 %}-z {{ _provision_benchmarks_freebsd_poudriere_set_effective }}{% endif %}
      {{ _provision_benchmarks_freebsd_origins | join(' ') }}
  register: provision_benchmarks_freebsd_poudriere_preflight_retry
  become: true
  changed_when: false
  when:
    - provision_benchmarks_freebsd_poudriere_preflight.rc != 0
    - "'jail already running' in (provision_benchmarks_freebsd_poudriere_preflight.stderr | default(''))"

- name: Verify poudriere preflight succeeded
  ansible.builtin.assert:
    that:
      - >-
        provision_benchmarks_freebsd_poudriere_preflight.rc == 0
        or (
          provision_benchmarks_freebsd_poudriere_preflight_retry is defined
          and provision_benchmarks_freebsd_poudriere_preflight_retry.rc == 0
        )
    fail_msg: >-
      Poudriere bulk dry-run preflight failed. First stderr:
      {{ provision_benchmarks_freebsd_poudriere_preflight.stderr | default('') }}.
      Retry stderr:
      {{ provision_benchmarks_freebsd_poudriere_preflight_retry.stderr | default('not attempted') }}.

- name: Build benchmark dependency set with poudriere
  ansible.builtin.command:
    cmd: >-
      poudriere bulk
      -j {{ provision_benchmarks_freebsd_poudriere_jail }}
      -p {{ provision_benchmarks_freebsd_poudriere_ports_tree }}
      {% if _provision_benchmarks_freebsd_poudriere_set_effective | length > 0 %}-z {{ _provision_benchmarks_freebsd_poudriere_set_effective }}{% endif %}
      {{ _provision_benchmarks_freebsd_origins | join(' ') }}
  become: true
  changed_when: true
  async: "{{ provision_benchmarks_freebsd_poudriere_build_timeout_sec }}"
  poll: 30

- name: Set poudriere ports tree root for origin-to-package resolution
  ansible.builtin.set_fact:
    _provision_benchmarks_freebsd_ports_tree_root: >-
      {{
        provision_benchmarks_freebsd_poudriere_basefs
      }}/ports/{{ provision_benchmarks_freebsd_poudriere_ports_tree }}

- name: Resolve package names from FreeBSD origins
  ansible.builtin.command:
    cmd: make -C {{ _provision_benchmarks_freebsd_ports_tree_root }}/{{ item }} -V PKGBASE
  loop: "{{ _provision_benchmarks_freebsd_origins | unique }}"
  register: provision_benchmarks_freebsd_pkg_name_query
  changed_when: false
  become: true

- name: Build unique FreeBSD package name list
  ansible.builtin.set_fact:
    provision_benchmarks_freebsd_pkg_names_from_origins: >-
      {{
        provision_benchmarks_freebsd_pkg_name_query.results
        | map(attribute='stdout')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Install benchmark dependencies from poudriere pkg repo (FreeBSD)
  ansible.builtin.command:
    cmd: >-
      pkg install -y
      {{ provision_benchmarks_freebsd_pkg_names_from_origins | join(' ') }}
  become: true
  changed_when: true
