---
# OpenIndiana – install via IPS (pkg).

- name: Check whether hipster-encumbered publisher is configured (OpenIndiana)
  ansible.builtin.command:
    cmd: pkg publisher hipster-encumbered
  become: true
  changed_when: false
  failed_when: false
  register: provision_benchmarks_openindiana_encumbered_publisher_check

- name: Enable hipster-encumbered publisher (OpenIndiana)
  ansible.builtin.command:
    cmd: pkg set-publisher -g https://pkg.openindiana.org/hipster-encumbered hipster-encumbered
  become: true
  when: provision_benchmarks_openindiana_encumbered_publisher_check.rc != 0

- name: Refresh package metadata (OpenIndiana)
  ansible.builtin.command:
    cmd: pkg refresh --full
  become: true
  changed_when: false
  failed_when: false

- name: Detect current OpenSSL mediator version (OpenIndiana)
  ansible.builtin.shell:
    cmd: |
      set -e
      pkg mediator -H openssl 2>/dev/null | awk 'NR==1{print $3}'
  become: true
  changed_when: false
  failed_when: false
  register: provision_benchmarks_openindiana_openssl_current_mediator_version

- name: Detect latest available OpenSSL mediator version (OpenIndiana)
  ansible.builtin.shell:
    cmd: |
      set -e
      pkg mediator -a openssl 2>/dev/null \
        | awk 'NR>1 && $3 != "-" {print $3}' \
        | sort -n \
        | tail -n 1
  become: true
  changed_when: false
  failed_when: false
  register: provision_benchmarks_openindiana_openssl_latest_mediator_version

- name: Set OpenSSL mediator to latest available version (OpenIndiana)
  ansible.builtin.command:
    cmd: >-
      pkg set-mediator -V
      {{ provision_benchmarks_openindiana_openssl_latest_mediator_version.stdout | trim }}
      openssl
  become: true
  when:
    - provision_benchmarks_openindiana_openssl_latest_mediator_version.stdout | trim != ""
    - >-
      provision_benchmarks_openindiana_openssl_latest_mediator_version.stdout | trim
      !=
      provision_benchmarks_openindiana_openssl_current_mediator_version.stdout | trim

- name: Install benchmark dependencies (OpenIndiana)
  ansible.builtin.package:
    name: "{{ provision_benchmarks_packages['OpenIndiana'] }}"
    state: present
  become: true
  failed_when: false
  register: provision_benchmarks_pkg_result

- name: Install packages individually on partial failure (OpenIndiana)
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  become: true
  loop: "{{ provision_benchmarks_packages['OpenIndiana'] }}"
  when: provision_benchmarks_pkg_result.rc | default(0) != 0
  failed_when: false

- name: Check whether hyperfine is already available (OpenIndiana)
  ansible.builtin.command:
    cmd: command -v hyperfine
  become: true
  changed_when: false
  failed_when: false
  register: provision_benchmarks_openindiana_hyperfine_check

- name: Install Rust toolchain for hyperfine build (OpenIndiana)
  ansible.builtin.package:
    name: developer/lang/rustc
    state: present
  become: true
  when: provision_benchmarks_openindiana_hyperfine_check.rc != 0
  failed_when: false
  register: provision_benchmarks_openindiana_rustc_install

- name: Build and install hyperfine via cargo (OpenIndiana)
  ansible.builtin.command:
    cmd: cargo install --locked hyperfine --root /usr
  become: true
  when: provision_benchmarks_openindiana_hyperfine_check.rc != 0
  failed_when: false
  register: provision_benchmarks_openindiana_hyperfine_cargo_install

- name: Re-check hyperfine after cargo install attempt (OpenIndiana)
  ansible.builtin.command:
    cmd: command -v hyperfine
  become: true
  changed_when: false
  failed_when: false
  register: provision_benchmarks_openindiana_hyperfine_recheck

- name: Warn when hyperfine remains unavailable (OpenIndiana)
  ansible.builtin.debug:
    msg: >-
      hyperfine is still unavailable on OpenIndiana after package/cargo attempts.
      Ensure sufficient free space for developer/lang/rustc (rust toolchain is
      required to build hyperfine via cargo) or install hyperfine via a local
      package source.
  when: provision_benchmarks_openindiana_hyperfine_recheck.rc != 0

- name: Install ffmpeg (OpenIndiana)
  ansible.builtin.package:
    name: ffmpeg
    state: present
  become: true
  when: provision_benchmarks_install_ffmpeg | bool
  failed_when: false

- name: Install numpy (OpenIndiana)
  ansible.builtin.package:
    name: "{{ provision_benchmarks_numpy_packages['OpenIndiana'] }}"
    state: present
  become: true
  when: provision_benchmarks_install_numpy | bool
  failed_when: false

- name: Install GIMP (OpenIndiana)
  ansible.builtin.package:
    name: gimp
    state: present
  become: true
  when: provision_benchmarks_install_gimp | bool
  failed_when: false

- name: Install Inkscape (OpenIndiana)
  ansible.builtin.package:
    name: inkscape
    state: present
  become: true
  when: provision_benchmarks_install_inkscape | bool
  failed_when: false

- name: Install OpenCV Python bindings (OpenIndiana)
  ansible.builtin.package:
    name: "{{ provision_benchmarks_opencv_packages['OpenIndiana'] }}"
    state: present
  become: true
  when: provision_benchmarks_install_opencv | bool
  failed_when: false

- name: Install Botan CLI (OpenIndiana)
  ansible.builtin.package:
    name: "{{ provision_benchmarks_botan_packages['OpenIndiana'] }}"
    state: present
  become: true
  when: provision_benchmarks_install_botan | bool
  failed_when: false

- name: Install mold linker (OpenIndiana)
  ansible.builtin.package:
    name: "{{ provision_benchmarks_mold_packages['OpenIndiana'] }}"
    state: present
  become: true
  when: provision_benchmarks_install_mold | bool
  failed_when: false

- name: Install Octave (OpenIndiana)
  ansible.builtin.package:
    name: "{{ provision_benchmarks_octave_packages['OpenIndiana'] }}"
    state: present
  become: true
  when: provision_benchmarks_install_octave | bool
  failed_when: false
  register: provision_benchmarks_openindiana_octave_install

- name: Warn when Octave package is unavailable (OpenIndiana)
  ansible.builtin.debug:
    msg: >-
      OpenIndiana package '{{ provision_benchmarks_octave_packages['OpenIndiana'] | join(', ') }}'
      is unavailable in currently enabled IPS publishers. The Octave benchmark
      remains optional and will be skipped.
  when:
    - provision_benchmarks_install_octave | bool
    - provision_benchmarks_openindiana_octave_install.rc | default(0) != 0

- name: Verify installed tools
  ansible.builtin.include_tasks: verify.yml
