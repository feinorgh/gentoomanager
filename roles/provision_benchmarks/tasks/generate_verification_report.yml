---
# Generate categorized verification report for benchmark tools.
# Reports on three categories: FOUND, MISSING, and UNRESOLVED tools.

- name: Create verification reports directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../benchmarks/verification_reports"
    state: directory
    mode: '0755'
  delegate_to: localhost
  run_once: true

- name: Set report tool lists
  ansible.builtin.set_fact:
    _provision_benchmarks_found_tools: "{{ _provision_benchmarks_verify_found | default([]) }}"
    _provision_benchmarks_missing_tools: "{{ _provision_benchmarks_verify_missing | default([]) }}"
    _provision_benchmarks_unresolved_tools: "{{ _provision_benchmarks_verify_unresolved | default([]) }}"

- name: Generate verification report
  ansible.builtin.template:
    src: verification_report.j2
    dest: "{{ playbook_dir }}/../benchmarks/verification_reports/verification_{{ ansible_date_time.iso8601_basic_short }}.txt"
  vars:
    _found_tools: "{{ _provision_benchmarks_found_tools }}"
    _missing_tools: "{{ _provision_benchmarks_missing_tools }}"
    _unresolved_tools: "{{ _provision_benchmarks_unresolved_tools }}"
  delegate_to: localhost
  register: _provision_benchmarks_report_result
  changed_when: false

- name: Display report
  ansible.builtin.debug:
    msg: |
      Verification Report Generated: {{ _provision_benchmarks_report_result.dest }}

      FOUND: {{ _provision_benchmarks_found_tools | length }}
      MISSING: {{ _provision_benchmarks_missing_tools | length }}
      UNRESOLVED: {{ _provision_benchmarks_unresolved_tools | length }}
