---
# Pre-flight sanity check: verify tools, sudo access, and disk space.
# Always produces warnings rather than failures — the benchmark play continues.

# ── 1. Probe for required and optional tools ──────────────────────────────
- name: Probe benchmark tool availability
  ansible.builtin.shell:
    cmd: |
      set -e
      missing_req=""
      missing_opt=""
      for tool in hyperfine openssl; do
        command -v "$tool" >/dev/null 2>&1 || missing_req="$missing_req $tool"
      done
      if ! command -v gcc >/dev/null 2>&1 && ! command -v cc >/dev/null 2>&1; then
        missing_req="$missing_req compiler"
      fi
      # Python: check for python3 or python (OpenBSD may have either)
      if ! command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
        missing_req="$missing_req python"
      fi
      for tool in clang rustc go ffmpeg; do
        command -v "$tool" >/dev/null 2>&1 || missing_opt="$missing_opt $tool"
      done
      if command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1; then
        :
      else
        missing_opt="$missing_opt imagemagick"
      fi
      if command -v 7z >/dev/null 2>&1 || command -v 7zz >/dev/null 2>&1; then
        :
      else
        missing_opt="$missing_opt 7zip"
      fi
      echo "missing_req=${missing_req# }"
      echo "missing_opt=${missing_opt# }"
    executable: /bin/sh
  register: run_benchmarks_sanity_tools
  changed_when: false
  failed_when: false

- name: Parse tool probe output
  ansible.builtin.set_fact:
    run_benchmarks_sanity_missing_req: >-
      {{ (run_benchmarks_sanity_tools.stdout_lines
          | select('match', '^missing_req=')
          | first
          | default('missing_req=')
          | regex_replace('^missing_req=', '')
         ).split() | select | list }}
    run_benchmarks_sanity_missing_opt: >-
      {{ (run_benchmarks_sanity_tools.stdout_lines
          | select('match', '^missing_opt=')
          | first
          | default('missing_opt=')
          | regex_replace('^missing_opt=', '')
         ).split() | select | list }}

# ── 2. Probe privilege escalation / become access ───────────────────────
- name: Probe passwordless privilege escalation
  ansible.builtin.shell:
    cmd: |
      # Detect sudo/doas/pfexec inline (runs before setup.yml defines run_benchmarks_priv_cmd)
      if command -v sudo >/dev/null 2>&1; then
        sudo -n true
      elif command -v doas >/dev/null 2>&1; then
        doas -n true
      elif command -v pfexec >/dev/null 2>&1; then
        pfexec true
      else
        exit 1
      fi
    executable: /bin/sh
  register: run_benchmarks_sanity_sudo
  changed_when: false
  failed_when: false

# ── 3. Probe available disk space on the work_dir partition ──────────────
- name: Probe free disk space on the work_dir partition
  ansible.builtin.shell:
    cmd: |
      # Walk up from work_dir to find the first existing ancestor so df works
      # even before the directory has been created.
      wdir="{{ run_benchmarks_work_dir }}"
      while [ ! -e "$wdir" ] && [ "$wdir" != "/" ]; do
        wdir=$(dirname "$wdir")
      done
      df -Pk "$wdir"
    executable: /bin/sh
  register: run_benchmarks_sanity_disk
  changed_when: false
  failed_when: false

- name: Evaluate disk space on work_dir partition
  ansible.builtin.set_fact:
    run_benchmarks_sanity_disk_free_mb: >-
      {{ ((run_benchmarks_sanity_disk.stdout_lines[-1].split()[3] | default('0') | int) / 1024) | round(0) | int }}
    run_benchmarks_sanity_disk_mount: >-
      {{ run_benchmarks_sanity_disk.stdout_lines[-1].split()[-1] | default('unknown') }}
    run_benchmarks_sanity_disk_ok: >-
      {{ ((run_benchmarks_sanity_disk.stdout_lines[-1].split()[3] | default('0') | int) / 1024) | int
         >= run_benchmarks_min_disk_mb }}

# ── 4. Check RAM when work_dir is on tmpfs ───────────────────────────────
# tmpfs "disk space" is backed by RAM, so the VM needs enough total RAM to
# hold all fixture files (~1.7 GB) plus OS and process overhead.
# This check runs before virsh RAM scaling (normalize.yml), so it reads
# MemTotal — the RAM currently allocated to the VM.  For KVM VMs the RAM
# is scaled to max before benchmarks start; this warning is informational.
- name: Detect whether work_dir partition is backed by tmpfs
  ansible.builtin.shell:
    cmd: |
      wdir="{{ run_benchmarks_work_dir }}"
      while [ ! -e "$wdir" ] && [ "$wdir" != "/" ]; do
        wdir=$(dirname "$wdir")
      done
      fstype=$(stat -f -c '%T' "$wdir" 2>/dev/null || echo unknown)
      echo "fstype=$fstype"
    executable: /bin/sh
  register: run_benchmarks_sanity_fstype_raw
  changed_when: false
  failed_when: false
  when: ansible_system | default('Linux') not in ['OpenBSD', 'SunOS']

- name: Probe total RAM (MemTotal from /proc/meminfo)
  ansible.builtin.shell:
    cmd: awk '/^MemTotal:/{print $2}' /proc/meminfo
    executable: /bin/sh
  register: run_benchmarks_sanity_memtotal_raw
  changed_when: false
  failed_when: false
  when: ansible_system | default('Linux') not in ['OpenBSD', 'SunOS']

- name: Evaluate RAM vs tmpfs requirement
  ansible.builtin.set_fact:
    run_benchmarks_sanity_is_tmpfs: >-
      {{ (run_benchmarks_sanity_fstype_raw.stdout | default('')).find('tmpfs') != -1 }}
    run_benchmarks_sanity_ram_total_mb: >-
      {{ ((run_benchmarks_sanity_memtotal_raw.stdout | default('0') | int) / 1024) | round(0) | int }}
    run_benchmarks_sanity_ram_ok: >-
      {{ ((run_benchmarks_sanity_memtotal_raw.stdout | default('0') | int) / 1024) | int
         >= run_benchmarks_min_ram_mb
         or (run_benchmarks_scale_ram | default(true) | bool) }}
  when: ansible_system | default('Linux') not in ['OpenBSD', 'SunOS']

- name: Probe available RAM (MemAvailable from /proc/meminfo)
  ansible.builtin.shell:
    cmd: awk '/^MemAvailable:/{print $2}' /proc/meminfo
    executable: /bin/sh
  register: run_benchmarks_sanity_memavail_raw
  changed_when: false
  failed_when: false
  when: ansible_system | default('') == 'Linux'

- name: Probe swap usage (SwapTotal/SwapFree from /proc/meminfo)
  ansible.builtin.shell:
    cmd: awk '/^SwapTotal:/{total=$2} /^SwapFree:/{free=$2} END{print total+0" "free+0}' /proc/meminfo
    executable: /bin/sh
  register: run_benchmarks_sanity_swap_raw
  changed_when: false
  failed_when: false
  when: ansible_system | default('') == 'Linux'

- name: Compute categories used for RAM-pressure threshold
  ansible.builtin.set_fact:
    run_benchmarks_sanity_effective_categories: >-
      {%- if _cats_list | length > 0 -%}
      {{ _cats_list }}{%- else -%}
      {{ run_benchmarks_ram_pressure_category_add_mb | default({}) | dict2items | map(attribute='key') | list }}{%- endif -%}
  vars:
    _cats_yaml: >-
      {{
        run_benchmarks_categories
        if run_benchmarks_categories is not string
        else (run_benchmarks_categories | from_yaml
              if run_benchmarks_categories | length > 0
              else [])
      }}
    _cats_list: >-
      {{
        (_cats_yaml.split(',') | map('trim') | reject('equalto', '') | list)
        if _cats_yaml is string
        else (_cats_yaml | list if _cats_yaml is sequence else [])
      }}
  when: ansible_system | default('') == 'Linux'

- name: Evaluate general RAM-pressure threshold inputs
  ansible.builtin.set_fact:
    run_benchmarks_sanity_ram_available_mb: >-
      {{ ((run_benchmarks_sanity_memavail_raw.stdout | default('0') | int) / 1024) | round(0) | int }}
    run_benchmarks_sanity_swap_total_kb: >-
      {{ (run_benchmarks_sanity_swap_raw.stdout.split() | first | default('0')) | int }}
    run_benchmarks_sanity_swap_free_kb: >-
      {{ (run_benchmarks_sanity_swap_raw.stdout.split() | last | default('0')) | int }}
    run_benchmarks_sanity_ram_pressure_add_mb: >-
      {%- set cfg = run_benchmarks_ram_pressure_category_add_mb | default({}) -%}
      {%- set selection = run_benchmarks_sanity_effective_categories | default([]) -%}
      {%- set ns = namespace(max_add=0) -%}
      {%- for category_name in selection -%}
        {%- set category_add = cfg.get(category_name, 0) | int -%}
        {%- if category_add > ns.max_add -%}
          {%- set ns.max_add = category_add -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.max_add }}
  when: ansible_system | default('') == 'Linux'

- name: Evaluate RAM-pressure required available memory threshold
  ansible.builtin.set_fact:
    run_benchmarks_sanity_ram_pressure_required_mb: >-
      {{ (run_benchmarks_min_available_ram_mb | default(1024) | int) + (run_benchmarks_sanity_ram_pressure_add_mb | int) }}
  when: ansible_system | default('') == 'Linux'

- name: Evaluate RAM-pressure swap usage percentage
  ansible.builtin.set_fact:
    run_benchmarks_sanity_swap_used_pct: >-
      {{
        (100 - ((run_benchmarks_sanity_swap_free_kb | int * 100) / (run_benchmarks_sanity_swap_total_kb | int)))
        | round(1)
        if (run_benchmarks_sanity_swap_total_kb | int) > 0
        else 0
      }}
  when: ansible_system | default('') == 'Linux'

- name: Evaluate general RAM-pressure warning thresholds
  ansible.builtin.set_fact:
    run_benchmarks_sanity_ram_pressure_warn: >-
      {{
        (run_benchmarks_sanity_ram_available_mb | int) < (run_benchmarks_sanity_ram_pressure_required_mb | int)
        or (run_benchmarks_sanity_swap_used_pct | float) > (run_benchmarks_warn_swap_used_pct | default(25) | float)
      }}
  when: ansible_system | default('') == 'Linux'

- name: Default tmpfs/RAM probe facts on OpenBSD/OpenIndiana
  ansible.builtin.set_fact:
    run_benchmarks_sanity_is_tmpfs: false
    run_benchmarks_sanity_ram_total_mb: 0
    run_benchmarks_sanity_ram_ok: true
    run_benchmarks_sanity_ram_available_mb: 0
    run_benchmarks_sanity_swap_used_pct: 0
    run_benchmarks_sanity_ram_pressure_required_mb: 0
    run_benchmarks_sanity_ram_pressure_warn: false
  when: ansible_system | default('') != 'Linux'

# ── 5. Emit warning when issues are detected ─────────────────────────────
- name: Warn — benchmark sanity check issues detected
  ansible.builtin.debug:
    msg: |
      ╔══════════════════════════════════════════════════════════════════════╗
      ║  BENCHMARK PRE-FLIGHT WARNING: {{ inventory_hostname }}
      ╚══════════════════════════════════════════════════════════════════════╝
      {% if run_benchmarks_sanity_missing_req | length > 0 %}
      ✗ REQUIRED tools missing — affected benchmark categories will be skipped:
          {{ run_benchmarks_sanity_missing_req | join(', ') }}
      {% endif %}
      {% if run_benchmarks_sanity_missing_opt | length > 0 %}
      ⚠ Optional tools missing — associated categories will be skipped:
          {{ run_benchmarks_sanity_missing_opt | join(', ') }}
      {% endif %}
      {% if run_benchmarks_sanity_sudo.rc | default(1) != 0 %}
      ✗ Passwordless privilege escalation NOT available — CPU governor pinning
          and swap disable/restore steps will be skipped or may fail.
          Ensure the Ansible user has passwordless sudo/doas/pfexec access configured.
      {% endif %}
      {% if not run_benchmarks_sanity_disk_ok %}
      ✗ Low disk space on partition '{{ run_benchmarks_sanity_disk_mount }}'
          (used by {{ run_benchmarks_work_dir }}):
          {{ run_benchmarks_sanity_disk_free_mb }} MB free,
          {{ run_benchmarks_min_disk_mb }} MB required.
          Free up space or set run_benchmarks_min_disk_mb to a lower value
          if running only a subset of benchmark categories.
      {% endif %}
      {% if run_benchmarks_sanity_is_tmpfs and not run_benchmarks_sanity_ram_ok %}
      ⚠ Work directory is on tmpfs (RAM-backed) but total RAM is only
          {{ run_benchmarks_sanity_ram_total_mb }} MB — below the recommended
          {{ run_benchmarks_min_ram_mb }} MB for a full benchmark run.
          Fixture files (~1.7 GB) and encode intermediates (~500 MB) reside
          in RAM when using tmpfs; insufficient RAM causes swap thrashing
          and distorts compression/coreutils results.
          Set run_benchmarks_scale_ram=true (default) so that KVM VMs have
          their RAM temporarily raised to max_memory before benchmarks run.
          To override: set run_benchmarks_min_ram_mb to a lower value.
      {% endif %}
      {% if run_benchmarks_sanity_ram_pressure_warn %}
      ⚠ Low available RAM for selected benchmark categories:
          available={{ run_benchmarks_sanity_ram_available_mb }} MB,
          recommended>= {{ run_benchmarks_sanity_ram_pressure_required_mb }} MB,
          swap used={{ run_benchmarks_sanity_swap_used_pct }}%
          (warn threshold={{ run_benchmarks_warn_swap_used_pct | default(25) }}%).
          Results may be skewed by memory reclaim/swap pressure.
      {% endif %}
      {% if run_benchmarks_sanity_missing_req | length > 0 or run_benchmarks_sanity_missing_opt | length > 0 %}
      ─────────────────────────────────────────────────────────────────────
      To install missing tools, run the provisioning playbook:

          ansible-playbook playbooks/provision_benchmarks.yml \
            -i inventory_generator.py \
            --limit {{ inventory_hostname }}

      ─────────────────────────────────────────────────────────────────────
      {% endif %}
      The benchmark run will proceed regardless of the above warnings.
  when: >-
    run_benchmarks_sanity_missing_req | length > 0 or
    run_benchmarks_sanity_missing_opt | length > 0 or
    run_benchmarks_sanity_sudo.rc | default(1) != 0 or
    not run_benchmarks_sanity_disk_ok or
    (run_benchmarks_sanity_is_tmpfs and not run_benchmarks_sanity_ram_ok) or
    run_benchmarks_sanity_ram_pressure_warn

# ── 6. Persist sanity-check notes ────────────────────────────────────────
# Compute distro-specific notes for tools that are unavailable due to
# non-default repository policy (e.g. RPM Fusion for ffmpeg on Red Hat).
- name: Compute distro-specific limitation notes
  ansible.builtin.set_fact:
    run_benchmarks_sanity_distro_notes: >-
      {%- set notes = [] -%}
      {%- set missing = run_benchmarks_sanity_missing_req + run_benchmarks_sanity_missing_opt -%}
      {%- set os_fam = ansible_os_family | default('') -%}
      {%- set distro = ansible_distribution | default('') -%}
      {%- if (os_fam == 'RedHat' or distro == 'Fedora') and 'ffmpeg' in missing -%}
        {%- set _ = notes.append('ffmpeg: not available in default Red Hat / Fedora repositories; '
          ~ 'full ffmpeg (with h264/h265) requires RPM Fusion which is a non-default '
          ~ 'third-party repository — intentionally not used so results reflect the '
          ~ 'default system package set') -%}
       {%- endif -%}
       {{ notes }}

- name: Compute OpenBSD/OpenIndiana normalization and platform notes
  ansible.builtin.set_fact:
    run_benchmarks_sanity_normalization_notes: >-
      {%- set notes = [] -%}
      {%- if ansible_system | default('') == 'OpenBSD' -%}
        {%- set _ = notes.append(
          'OpenBSD uses sync-only safe-subset normalization; Linux-specific cache-drop '
          ~ 'and related normalization steps are not applied.'
        ) -%}
      {%- endif -%}
      {%- if ansible_system | default('') == 'SunOS' -%}
        {%- set _ = notes.append(
          'OpenIndiana uses sync-only safe-subset normalization; Linux-specific cache-drop '
          ~ 'and related normalization steps are not applied.'
        ) -%}
      {%- endif -%}
      {{ notes }}
    run_benchmarks_sanity_platform_notes: >-
      {%- set notes = [] -%}
      {%- if ansible_system | default('') == 'OpenBSD' -%}
        {%- set _ = notes.append(
          'OpenBSD skips the Linux-specific tmpfs/RAM pre-flight probe because '
          ~ 'GNU stat -f -c and /proc/meminfo are not portable there.'
        ) -%}
      {%- endif -%}
      {%- if ansible_system | default('') == 'SunOS' -%}
        {%- set _ = notes.append(
          'OpenIndiana skips the Linux-specific tmpfs/RAM pre-flight probe because '
          ~ 'GNU stat -f -c and /proc/meminfo are not portable there.'
        ) -%}
      {%- endif -%}
      {{ notes }}

# ── 7. Set OpenBSD tier 3 category skip reasons ───────────────────────────
# These must be set HERE (before benchmark_notes.json write) because
# sanity_check.yml runs BEFORE category task files in the playbook flow.
# The category task files (disk.yml, boot_time.yml) still have their own
# OpenBSD gates but do NOT set skip_reason variables (too late by then).
- name: Set OpenBSD tier 3 category skip reasons (disk)
  ansible.builtin.set_fact:
    run_benchmarks_disk_skip_reason: >-
      Disk benchmark category is Tier 3 on OpenBSD (requires explicit review
      before safe OpenBSD-native implementation is confirmed). The Linux-specific
       df/dd commands and /proc/sys/vm/drop_caches cache-drop mechanism have no
       direct OpenBSD equivalent verified as safe for benchmark use.
  when: ansible_system | default('Linux') == 'OpenBSD'

- name: Set OpenIndiana tier 3 category skip reasons (disk)
  ansible.builtin.set_fact:
    run_benchmarks_disk_skip_reason: >-
      Disk benchmark category is Tier 3 on OpenIndiana (requires explicit review
      before safe OpenIndiana-native implementation is confirmed). The Linux-specific
      df/dd commands and /proc/sys/vm/drop_caches cache-drop mechanism have no
      direct OpenIndiana equivalent verified as safe for benchmark use.
  when: ansible_system | default('Linux') == 'SunOS'

- name: Ensure benchmark work directory exists for support-boundary artifacts
  ansible.builtin.file:
    path: "{{ run_benchmarks_work_dir }}"
    state: directory
    mode: "0755"
  changed_when: false
  failed_when: false

- name: Write benchmark notes (missing tools + distro limitations)
  ansible.builtin.copy:
    dest: "{{ run_benchmarks_work_dir }}/benchmark_notes.json"
    content: "{{ _notes | to_nice_json }}"
    mode: "0644"
  vars:
    _notes:
      missing_tools:
        required: "{{ run_benchmarks_sanity_missing_req | default([]) }}"
        optional: "{{ run_benchmarks_sanity_missing_opt | default([]) }}"
      distro_notes: "{{ run_benchmarks_sanity_distro_notes | default([]) }}"
      normalization_notes: "{{ run_benchmarks_sanity_normalization_notes | default([]) }}"
      platform_notes: "{{ run_benchmarks_sanity_platform_notes | default([]) }}"
      ram_pressure:
        available_mb: "{{ run_benchmarks_sanity_ram_available_mb | default(0) }}"
        required_mb: "{{ run_benchmarks_sanity_ram_pressure_required_mb | default(0) }}"
        swap_used_pct: "{{ run_benchmarks_sanity_swap_used_pct | default(0) }}"
        warning: "{{ run_benchmarks_sanity_ram_pressure_warn | default(false) }}"
      benchmark_failures: []
      category_skip_reasons:
        disk: "{{ run_benchmarks_disk_skip_reason | default('') }}"
  changed_when: false
  failed_when: false

- name: Write OpenBSD/OpenIndiana disk skip artifact
  ansible.builtin.copy:
    dest: "{{ run_benchmarks_work_dir }}/disk_skip.json"
    content: >-
      {{
        {
          'category': 'disk',
          'status': 'unsupported',
          'reason': run_benchmarks_disk_skip_reason | default('')
        } | to_nice_json
      }}
    mode: "0644"
  changed_when: false
  failed_when: false
  when: ansible_system | default('Linux') in ['OpenBSD', 'SunOS']
