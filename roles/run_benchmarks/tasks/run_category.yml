---
# Per-category wrapper: prepare system state then include the category task file.
# Called from main.yml with loop_var: run_benchmarks_current_category.

- name: Prepare system state before benchmark category
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      {{ run_benchmarks_category_prepare_cmd }}
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  become: true
  changed_when: false
  ignore_errors: true
  when: run_benchmarks_category_prepare_cmd is defined

- name: Include benchmark category tasks
  ansible.builtin.include_tasks:
    file: >-
      {{ run_benchmarks_current_category }}{{ '_win' if (run_benchmarks_is_windows and
         run_benchmarks_current_category in run_benchmarks_windows_categories) else '' }}.yml
