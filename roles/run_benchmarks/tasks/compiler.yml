---
# Compiler benchmarks: gcc, clang, rustc, go

- name: Create C benchmark project
  ansible.builtin.copy:
    dest: "{{ run_benchmarks_work_dir }}/bench.c"
    mode: "0644"
    content: |
      /* Small but non-trivial C benchmark: matrix multiply + sorting */
      #include <stdio.h>
      #include <stdlib.h>
      #include <string.h>

      #define N 256

      static double A[N][N], B[N][N], C[N][N];

      static void matmul(void) {
          for (int i = 0; i < N; i++)
              for (int j = 0; j < N; j++) {
                  double sum = 0.0;
                  for (int k = 0; k < N; k++)
                      sum += A[i][k] * B[k][j];
                  C[i][j] = sum;
              }
      }

      static int cmp(const void *a, const void *b) {
          double da = *(const double *)a, db = *(const double *)b;
          return (da > db) - (da < db);
      }

      int main(void) {
          srand(42);
          for (int i = 0; i < N; i++)
              for (int j = 0; j < N; j++) {
                  A[i][j] = (double)rand() / RAND_MAX;
                  B[i][j] = (double)rand() / RAND_MAX;
              }
          matmul();
          qsort(C, N * N, sizeof(double), cmp);
          printf("result: %f\n", C[N * N / 2]);
          return 0;
      }

- name: Check available compilers
  ansible.builtin.shell:
    cmd: |
      resolved_cc=$(basename {{ run_benchmarks_gcc_cmd | quote }})
      if command -v {{ run_benchmarks_gcc_cmd | quote }} >/dev/null 2>&1; then
        printf '%s\n' "$resolved_cc"
      fi
      for cmd in gcc clang rustc go; do
        command -v "$cmd" >/dev/null 2>&1 && echo "$cmd"
      done
  register: run_benchmarks_compilers_available
  changed_when: false
  failed_when: false

# Discover all installed gcc/clang versions, including versioned binaries
# (gcc-13, clang-17) and Gentoo gcc-config slots not on the active PATH.
# Output: one "LABEL EXECUTABLE" line per unique binary (deduplicated by
# resolved real path so the active-slot symlink is not benchmarked twice).
- name: Discover versioned C compiler binaries
  ansible.builtin.shell:
    cmd: |
      set +e
      set -o pipefail
      {
        # versioned patterns gcc-N, clang-N, gccN, clangN
        IFS=:
        for d in $PATH; do
          [ -d "$d" ] || continue
          for f in "$d"/gcc-[0-9]* "$d"/clang-[0-9]* "$d"/gcc[0-9]* "$d"/clang[0-9]*; do
            [ -x "$f" ] || continue
            name=$(basename "$f")
            full=$(command -v "$name" 2>/dev/null) || full="$f"
            printf '%s %s\n' "$name" "$full"
          done
        done
        unset IFS
        # Resolved compiler from setup (e.g. OpenBSD may prefer cc)
        full=$(command -v {{ run_benchmarks_gcc_cmd | quote }} 2>/dev/null) || true
        [ -n "$full" ] && printf '{{ run_benchmarks_gcc_cmd | basename }} %s\n' "$full"
        # Generic gcc / clang (added after versioned so they sort last and
        # are dropped by dedup if a versioned binary resolves to the same path)
        for cc in gcc clang; do
          full=$(command -v "$cc" 2>/dev/null) || continue
          printf '%s %s\n' "$cc" "$full"
        done
        # Explicit probes for well-known BSD system compiler paths that may
        # not be reachable via PATH in non-login SSH sessions (FreeBSD /usr/bin/cc
        # is clang; /usr/local/bin/clangN / gccN are common ports locations).
        for cc_path in /usr/bin/cc /usr/bin/clang /usr/local/bin/cc /usr/local/bin/clang; do
          [ -x "$cc_path" ] || continue
          printf '%s %s\n' "$(basename "$cc_path")" "$cc_path"
        done
        # Versioned compilers installed under /usr/local/bin (FreeBSD ports,
        # Homebrew, pkgsrc) — these are not guaranteed to be in the SSH PATH
        # so the $PATH loop above may miss them entirely.
        for f in /usr/local/bin/gcc-[0-9]* /usr/local/bin/gcc[0-9]* \
                 /usr/local/bin/clang-[0-9]* /usr/local/bin/clang[0-9]*; do
          [ -x "$f" ] || continue
          printf '%s %s\n' "$(basename "$f")" "$f"
        done
        # Gentoo: non-active gcc-config slots (may not be on PATH)
        if command -v gcc-config >/dev/null 2>&1; then
          gcc-config -l 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' |
          while read -r ver; do
            for bin in /usr/*/gcc-bin/"$ver"/gcc; do
              [ -x "$bin" ] && printf 'gcc-%s %s\n' "$ver" "$bin"
            done
          done
        fi
      } | while IFS=' ' read -r label path; do
          real=$({{ run_benchmarks_python_cmd }} -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$path" 2>/dev/null || echo "$path")
          printf '%s\t%s\t%s\n' "$real" "$label" "$path"
        done | sort -t$'\t' -k1,1 -u | awk -F'\t' '{print $2" "$3}'
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  register: run_benchmarks_cc_versions
  changed_when: false
  failed_when: false

# Resolves each discovered compiler binary to its full semver label (e.g.
# gcc-14.3.1, clang-17.0.6) and deduplicates by (family, full_version) so
# that gcc-14 and a gcc-config slot both referencing the same compiler version
# are benchmarked only once.
# stdout: "LABEL EXECUTABLE" lines for benchmark tasks
# stderr: JSON version map written to compiler_versions.json
- name: Resolve C compiler full versions and deduplicate
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      {{ run_benchmarks_python_cmd }} - << 'PYEOF'
      import json, re, subprocess, sys
      lines = """{{ run_benchmarks_cc_versions.stdout | default('') }}""".strip().splitlines()
      seen: dict = {}   # (family, full_ver) → (new_label, exe, ver_string)
      for line in lines:
          parts = line.split(None, 1)
          if len(parts) < 2:
              continue
          label, exe = parts[0], parts[1]
          try:
              out = subprocess.run([exe, '--version'], capture_output=True, text=True,
                                   timeout=5, check=False)
              ver_str = (out.stdout or out.stderr).strip().splitlines()[0]
          except Exception as exc:
              ver_str = str(exc)
          ver_str_lower = ver_str.lower()
          if 'clang' in ver_str_lower:
              family = 'clang'
          elif 'gcc' in ver_str_lower or 'free software foundation' in ver_str_lower:
              family = 'gcc'
          elif label.startswith('gcc'):
              family = 'gcc'
          elif label.startswith('clang'):
              family = 'clang'
          else:
              m_fam = re.match(r'^([a-z]+)', label)
              family = m_fam.group(1) if m_fam else label
          m = re.search(r'\b(\d+\.\d+\.\d+)\b', ver_str)
          if not m:
              continue
          full_ver = m.group(1)
          key = (family, full_ver)
          if key not in seen:
              new_label = f'{family}-{full_ver}'
              seen[key] = (new_label, exe, ver_str)
      version_map: dict = {}
      for (family, full_ver), (new_label, exe, ver_str) in sorted(seen.items()):
          print(f'{new_label} {exe}')
          version_map[new_label] = ver_str
      print(json.dumps(version_map, indent=2), file=sys.stderr)
      PYEOF
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  register: run_benchmarks_cc_resolved
  changed_when: false
  failed_when: false

- name: Write compiler_versions.json
  ansible.builtin.copy:
    dest: "{{ run_benchmarks_work_dir }}/compiler_versions.json"
    content: >-
      {{
        (run_benchmarks_cc_resolved.stderr | default('{}') | from_json) |
        combine(run_benchmarks_rust_resolved.stderr | default('{}') | from_json) |
        combine(run_benchmarks_go_resolved.stderr | default('{}') | from_json) |
        to_nice_json
      }}
    mode: "0644"
  when: run_benchmarks_cc_resolved.rc | default(1) == 0

- name: Run C compiler benchmarks
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      cd {{ run_benchmarks_work_dir }}
      CMDS=()
      {% for cc in run_benchmarks_cc_resolved.stdout_lines | default([]) %}
      {% set cc_parts = cc.split() %}
      {% if cc_parts | length >= 2 %}
      {% set cc_label = cc_parts[0] %}
      {% set cc_exe = cc_parts[1] %}
      if [ -x "{{ cc_exe }}" ]; then
        for opt in "-O0" "-O2" "-O3" "-O3 -flto" "-Os"; do
          OPTLABEL=$(echo "$opt" | tr ' ' '_')
          CMDS+=(--command-name "{{ cc_label }}-${OPTLABEL}-compile"
            "{{ cc_exe }} $opt -o bench_{{ cc_label }}_${OPTLABEL} bench.c -lm")
        done
      {% if cc_label.startswith('gcc') %}
        # GCC Graphite polyhedral loop optimiser (requires GCC built with --with-isl)
        if {{ cc_exe }} -O3 -floop-nest-optimize -o bench_{{ cc_label }}_graphite_probe bench.c -lm 2>/dev/null; then
          CMDS+=(--command-name "{{ cc_label }}-O3_graphite-compile"
            "{{ cc_exe }} -O3 -floop-nest-optimize -o bench_{{ cc_label }}_O3_graphite bench.c -lm")
        fi
        rm -f bench_{{ cc_label }}_graphite_probe
      {% elif cc_label.startswith('clang') %}
        # Clang Polly polyhedral loop optimiser (requires Clang built with Polly)
        if {{ cc_exe }} -O3 -mllvm -polly -o bench_{{ cc_label }}_polly_probe bench.c -lm 2>/dev/null; then
          CMDS+=(--command-name "{{ cc_label }}-O3_polly-compile"
            "{{ cc_exe }} -O3 -mllvm -polly -o bench_{{ cc_label }}_O3_polly bench.c -lm")
        fi
        rm -f bench_{{ cc_label }}_polly_probe
      {% endif %}
      fi
      {% endif %}
      {% endfor %}
      {{ run_benchmarks_hyperfine_bin }} \
        --runs {{ run_benchmarks_runs }} \
        --warmup {{ run_benchmarks_warmup }} \
        --ignore-failure \
        --export-json {{ run_benchmarks_work_dir }}/compiler_c_compile.json \
        "${CMDS[@]}"
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  args:
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  register: run_benchmarks_compiler_c_result
  changed_when: false
  failed_when: false

- name: Warn on compiler_c benchmark failure
  ansible.builtin.debug:
    msg: >-
      [WARN] {{ inventory_hostname }}: compiler_c benchmark exited
      rc={{ run_benchmarks_compiler_c_result.rc }}.
      {{ run_benchmarks_compiler_c_result.stderr | default('') | truncate(300) | trim }}
  when:
    - run_benchmarks_compiler_c_result is not skipped
    - run_benchmarks_compiler_c_result.rc | default(0) != 0

- name: Run C runtime benchmarks (compiled binaries)
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      cd {{ run_benchmarks_work_dir }}
      CMDS=()
      {% for cc in run_benchmarks_cc_resolved.stdout_lines | default([]) %}
      {% set cc_parts = cc.split() %}
      {% if cc_parts | length >= 2 %}
      {% set cc_label = cc_parts[0] %}
      {% set cc_exe = cc_parts[1] %}
      if [ -x "{{ cc_exe }}" ]; then
        for opt in "-O2" "-O3" "-O3 -flto"; do
          OPTLABEL=$(echo "$opt" | tr ' ' '_')
          # shellcheck disable=SC2086  # $opt is intentionally word-split (flag list)
          {{ cc_exe }} $opt -o "bench_{{ cc_label }}_${OPTLABEL}" bench.c -lm 2>/dev/null || true
          if [ -f "bench_{{ cc_label }}_${OPTLABEL}" ]; then
            CMDS+=(--command-name "{{ cc_label }}-${OPTLABEL}-run"
              "./bench_{{ cc_label }}_${OPTLABEL}")
          fi
        done
      {% if cc_label.startswith('gcc') %}
        # GCC Graphite runtime
        if {{ cc_exe }} -O3 -floop-nest-optimize -o "bench_{{ cc_label }}_O3_graphite" bench.c -lm 2>/dev/null; then
          CMDS+=(--command-name "{{ cc_label }}-O3_graphite-run"
            "./bench_{{ cc_label }}_O3_graphite")
        fi
      {% elif cc_label.startswith('clang') %}
        # Clang Polly runtime
        if {{ cc_exe }} -O3 -mllvm -polly -o "bench_{{ cc_label }}_O3_polly" bench.c -lm 2>/dev/null; then
          CMDS+=(--command-name "{{ cc_label }}-O3_polly-run"
            "./bench_{{ cc_label }}_O3_polly")
        fi
      {% endif %}
      fi
      {% endif %}
      {% endfor %}
      {{ run_benchmarks_hyperfine_bin }} \
        --runs {{ run_benchmarks_runs }} \
        --warmup {{ run_benchmarks_warmup }} \
        --ignore-failure \
        --export-json {{ run_benchmarks_work_dir }}/compiler_c_runtime.json \
        "${CMDS[@]}"
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  args:
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  register: run_benchmarks_compiler_c_runtime_result
  changed_when: false
  failed_when: false

- name: Warn on compiler_c_runtime benchmark failure
  ansible.builtin.debug:
    msg: >-
      [WARN] {{ inventory_hostname }}: compiler_c_runtime benchmark exited
      rc={{ run_benchmarks_compiler_c_runtime_result.rc }}.
      {{ run_benchmarks_compiler_c_runtime_result.stderr | default('') | truncate(300) | trim }}
  when:
    - run_benchmarks_compiler_c_runtime_result is not skipped
    - run_benchmarks_compiler_c_runtime_result.rc | default(0) != 0

- name: Create Rust benchmark directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ run_benchmarks_work_dir }}/rust_bench/compile_bench/src"
    - "{{ run_benchmarks_work_dir }}/rust_bench/runtime_bench/src"
    - "{{ run_benchmarks_work_dir }}/rust_bench/external_bench/src"
    - "{{ run_benchmarks_work_dir }}/rust_bench/external_bench/fixtures"
  when: "'rustc' in run_benchmarks_compilers_available.stdout"

- name: Deploy Rust benchmark sources
  ansible.builtin.copy:
    src: "rust_bench/{{ item.src }}"
    dest: "{{ run_benchmarks_work_dir }}/rust_bench/{{ item.src }}"
    mode: "0644"
  loop:
    - { src: compile_bench/Cargo.toml }
    - { src: compile_bench/src/main.rs }
    - { src: runtime_bench/Cargo.toml }
    - { src: runtime_bench/src/main.rs }
    - { src: external_bench/Cargo.toml }
    - { src: external_bench/src/main.rs }
    - { src: external_bench/fixtures/external_input.json }
  when: "'rustc' in run_benchmarks_compilers_available.stdout"

- name: Remove stale top-level Rust workspace files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ run_benchmarks_work_dir }}/rust_bench/Cargo.toml"
    - "{{ run_benchmarks_work_dir }}/rust_bench/src/main.rs"
    - "{{ run_benchmarks_work_dir }}/rust_bench/src/runtime.rs"
    - "{{ run_benchmarks_work_dir }}/rust_bench/src/external.rs"
  when: "'rustc' in run_benchmarks_compilers_available.stdout"

- name: Generate Cargo.lock for external Rust benchmark
  ansible.builtin.command:
    cmd: cargo generate-lockfile
    chdir: "{{ run_benchmarks_work_dir }}/rust_bench/external_bench"
    creates: "{{ run_benchmarks_work_dir }}/rust_bench/external_bench/Cargo.lock"
  changed_when: false
  failed_when: false
  when: "'rustc' in run_benchmarks_compilers_available.stdout"

# Discover all Rust toolchains, outputting "LABEL /path/to/cargo" per unique binary.
# Sources checked (in order, deduplicated by resolved real path):
#   1. rustup toolchains (stable, nightly, beta, pinned)
#   2. Gentoo eselect rust slots (/usr/lib/rust/<ver>/bin/cargo)
#   3. Bare cargo on PATH (when neither rustup nor eselect is present)
- name: Discover Rust toolchains
  ansible.builtin.shell:
    cmd: |
      set +e
      set -o pipefail
      {
        if command -v rustup >/dev/null 2>&1; then
          rustup toolchain list 2>/dev/null | while read -r toolchain _rest; do
            # Strip arch suffix: stable-x86_64-unknown-linux-gnu → stable
            short=$(echo "$toolchain" | sed 's/-x86_64-.*//; s/-aarch64-.*//; s/-arm-.*//')
            cargo_bin=$(rustup which --toolchain "$toolchain" cargo 2>/dev/null) || continue
            printf '%s %s\n' "$short" "$cargo_bin"
          done
        fi
        # Gentoo: eselect rust managed slots (may include non-active versions not on PATH)
        if command -v eselect >/dev/null 2>&1 && eselect rust list >/dev/null 2>&1; then
          eselect rust list 2>/dev/null | grep -oE 'rust-[0-9]+\.[0-9]+\.[0-9]+' |
          while read -r slot; do
            ver="${slot#rust-}"
            for cargo_bin in "/usr/lib/rust/${ver}/bin/cargo" \
                             "/usr/lib64/rust/${ver}/bin/cargo" \
                             "/usr/bin/cargo-${ver}"; do
              [ -x "$cargo_bin" ] && printf '%s %s\n' "$slot" "$cargo_bin" && break
            done
          done
        fi
        # Bare cargo fallback (no rustup, no eselect)
        if ! command -v rustup >/dev/null 2>&1 && \
           ! (command -v eselect >/dev/null 2>&1 && eselect rust list >/dev/null 2>&1); then
          cargo_bin=$(command -v cargo 2>/dev/null) || true
          [ -n "$cargo_bin" ] && printf 'rustc %s\n' "$cargo_bin"
        fi
      } | while IFS=' ' read -r label cargo_bin; do
          real=$({{ run_benchmarks_python_cmd }} -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$cargo_bin" 2>/dev/null || echo "$cargo_bin")
          printf '%s\t%s\t%s\n' "$real" "$label" "$cargo_bin"
        done | sort -t$'\t' -k1,1 -u | awk -F'\t' '{print $2" "$3}'
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  register: run_benchmarks_rust_toolchains
  changed_when: false
  failed_when: false
  when: "'rustc' in run_benchmarks_compilers_available.stdout"

# Resolves each Rust toolchain (stable, nightly, eselect slots) to its full
# version label (e.g. rustc-1.86.0) and deduplicates by full version.
# stdout: "LABEL CARGO_PATH" lines for benchmark tasks
# stderr: JSON version map merged into compiler_versions.json
- name: Resolve Rust toolchain versions and deduplicate
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      {{ run_benchmarks_python_cmd }} - << 'PYEOF'
      import json, os, re, subprocess, sys
      lines = """{{ run_benchmarks_rust_toolchains.stdout | default('') }}""".strip().splitlines()
      seen: dict = {}   # full_ver → (new_label, cargo_bin, ver_string)
      for line in lines:
          parts = line.split(None, 1)
          if len(parts) < 2:
              continue
          label, cargo_bin = parts[0], parts[1]
          rustc_bin = os.path.join(os.path.dirname(cargo_bin), 'rustc')
          cmd = [rustc_bin, '--version'] if os.path.isfile(rustc_bin) else ['rustc', '--version']
          try:
              out = subprocess.run(cmd, capture_output=True, text=True, timeout=10, check=False)
              ver_str = (out.stdout or out.stderr).strip().splitlines()[0]
          except Exception as exc:
              ver_str = str(exc)
          m = re.search(r'rustc\s+(\d+\.\d+\.\d+(?:-\w+)?)', ver_str)
          if not m:
              continue
          full_ver = m.group(1)
          if full_ver not in seen:
              new_label = f'rustc-{full_ver}'
              seen[full_ver] = (new_label, cargo_bin, ver_str)
      version_map: dict = {}
      for full_ver, (new_label, cargo_bin, ver_str) in sorted(seen.items()):
          print(f'{new_label} {cargo_bin}')
          version_map[new_label] = ver_str
      print(json.dumps(version_map, indent=2), file=sys.stderr)
      PYEOF
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  register: run_benchmarks_rust_resolved
  changed_when: false
  failed_when: false
  when: "'rustc' in run_benchmarks_compilers_available.stdout"

- name: Run Rust compile benchmark
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      cd {{ run_benchmarks_work_dir }}/rust_bench/compile_bench
      CMDS=()
      {% for tc in run_benchmarks_rust_resolved.stdout_lines | default([]) %}
      {% set tc_parts = tc.split() %}
      {% if tc_parts | length >= 2 %}
      {% set tc_label = tc_parts[0] %}
      {% set tc_cargo = tc_parts[1] %}
      if [ -x "{{ tc_cargo }}" ]; then
        CMDS+=(--command-name "{{ tc_label }}-cargo-debug"   "{{ tc_cargo }} build 2>&1")
        CMDS+=(--command-name "{{ tc_label }}-cargo-release" "{{ tc_cargo }} build --release 2>&1")
      fi
      {% endif %}
      {% endfor %}
      if [ -z "${CMDS[*]}" ]; then
        exit 0
      fi
      {{ run_benchmarks_hyperfine_bin }} \
        --runs {{ run_benchmarks_runs }} \
        --warmup {{ run_benchmarks_warmup }} \
        --ignore-failure \
        --prepare 'cargo clean 2>/dev/null || true' \
        --export-json {{ run_benchmarks_work_dir }}/compiler_rust.json \
        "${CMDS[@]}"
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  args:
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  when: "'rustc' in run_benchmarks_compilers_available.stdout"
  register: run_benchmarks_compiler_rust_result
  changed_when: false
  failed_when: false

- name: Warn on compiler_rust benchmark failure
  ansible.builtin.debug:
    msg: >-
      [WARN] {{ inventory_hostname }}: compiler_rust benchmark exited
      rc={{ run_benchmarks_compiler_rust_result.rc }}.
      {{ run_benchmarks_compiler_rust_result.stderr | default('') | truncate(300) | trim }}
  when:
    - run_benchmarks_compiler_rust_result is not skipped
    - run_benchmarks_compiler_rust_result.rc | default(0) != 0

- name: Run Rust runtime benchmark
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      cd {{ run_benchmarks_work_dir }}/rust_bench/runtime_bench
      CMDS=()
      FAILED_TOOLCHAINS=()
      {% for tc in run_benchmarks_rust_resolved.stdout_lines | default([]) %}
      {% set tc_parts = tc.split() %}
      {% if tc_parts | length >= 2 %}
      {% set tc_label = tc_parts[0] %}
      {% set tc_cargo = tc_parts[1] %}
      if [ -x "{{ tc_cargo }}" ]; then
        runtime_bin="./target/release/rust_runtime_{{ tc_label }}"
        rm -f "$runtime_bin"
        if {{ tc_cargo }} build --release --bin rust_runtime >/dev/null 2>&1; then
          cp ./target/release/rust_runtime "$runtime_bin"
        else
          FAILED_TOOLCHAINS+=("{{ tc_label }}")
        fi
        if [ -x "$runtime_bin" ]; then
          CMDS+=(
            --command-name "{{ tc_label }}-runtime"
            "RUST_RUNTIME_ITERATIONS={{ run_benchmarks_rust_runtime_iterations }} $runtime_bin"
          )
        fi
      fi
      {% endif %}
      {% endfor %}
      if [ -n "${FAILED_TOOLCHAINS[*]}" ] && [ -z "${CMDS[*]}" ]; then
        rm -f {{ run_benchmarks_work_dir }}/compiler_rust_runtime.json
        printf 'failed Rust runtime builds for: %s\n' "${FAILED_TOOLCHAINS[*]}" >&2
        exit 1
      fi
      [ -z "${CMDS[*]}" ] && exit 0
      if {{ run_benchmarks_hyperfine_bin }} --runs {{ run_benchmarks_runs }} --warmup {{ run_benchmarks_warmup }} --ignore-failure --export-json {{ run_benchmarks_work_dir }}/compiler_rust_runtime.json "${CMDS[@]}"; then
        hyperfine_rc=0
      else
        hyperfine_rc=$?
      fi
      if [ -n "${FAILED_TOOLCHAINS[*]}" ]; then
        if [ -z "${CMDS[*]}" ]; then
          rm -f {{ run_benchmarks_work_dir }}/compiler_rust_runtime.json
        fi
        printf 'failed Rust runtime builds for: %s\n' "${FAILED_TOOLCHAINS[*]}" >&2
        exit 1
      fi
      exit "$hyperfine_rc"
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  args:
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  when: "'rustc' in run_benchmarks_compilers_available.stdout"
  register: run_benchmarks_compiler_rust_runtime_result
  changed_when: false
  failed_when: false

- name: Warn on compiler_rust_runtime benchmark failure
  ansible.builtin.debug:
    msg: >-
      [WARN] {{ inventory_hostname }}: compiler_rust_runtime benchmark exited
      rc={{ run_benchmarks_compiler_rust_runtime_result.rc }}.
      {{ run_benchmarks_compiler_rust_runtime_result.stderr | default('') | truncate(300) | trim }}
  when:
    - run_benchmarks_compiler_rust_runtime_result is not skipped
    - run_benchmarks_compiler_rust_runtime_result.rc | default(0) != 0

- name: Run Rust external workload benchmark
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      cd {{ run_benchmarks_work_dir }}/rust_bench/external_bench
      CMDS=()
      FAILED_TOOLCHAINS=()
      {% for tc in run_benchmarks_rust_resolved.stdout_lines | default([]) %}
      {% set tc_parts = tc.split() %}
      {% if tc_parts | length >= 2 %}
      {% set tc_label = tc_parts[0] %}
      {% set tc_cargo = tc_parts[1] %}
      if [ -x "{{ tc_cargo }}" ]; then
        external_bin="./target/release/rust_external_{{ tc_label }}"
        rm -f "$external_bin"
        if {{ tc_cargo }} build --release --bin rust_external >/dev/null 2>&1; then
          cp ./target/release/rust_external "$external_bin"
        else
          FAILED_TOOLCHAINS+=("{{ tc_label }}")
        fi
        if [ -x "$external_bin" ]; then
          CMDS+=(--command-name "{{ tc_label }}-external" "$external_bin")
        fi
      fi
      {% endif %}
      {% endfor %}
      if [ -n "${FAILED_TOOLCHAINS[*]}" ] && [ -z "${CMDS[*]}" ]; then
        rm -f {{ run_benchmarks_work_dir }}/compiler_rust_external.json
        printf 'failed Rust external builds for: %s\n' "${FAILED_TOOLCHAINS[*]}" >&2
        exit 1
      fi
      [ -z "${CMDS[*]}" ] && exit 0
      if {{ run_benchmarks_hyperfine_bin }} --runs {{ run_benchmarks_runs }} --warmup {{ run_benchmarks_warmup }} --ignore-failure --export-json {{ run_benchmarks_work_dir }}/compiler_rust_external.json "${CMDS[@]}"; then
        hyperfine_rc=0
      else
        hyperfine_rc=$?
      fi
      if [ -n "${FAILED_TOOLCHAINS[*]}" ]; then
        if [ -z "${CMDS[*]}" ]; then
          rm -f {{ run_benchmarks_work_dir }}/compiler_rust_external.json
        fi
        printf 'failed Rust external builds for: %s\n' "${FAILED_TOOLCHAINS[*]}" >&2
        exit 1
      fi
      exit "$hyperfine_rc"
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  args:
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  when: "'rustc' in run_benchmarks_compilers_available.stdout"
  register: run_benchmarks_compiler_rust_external_result
  changed_when: false
  failed_when: false

- name: Warn on compiler_rust_external benchmark failure
  ansible.builtin.debug:
    msg: >-
      [WARN] {{ inventory_hostname }}: compiler_rust_external benchmark exited
      rc={{ run_benchmarks_compiler_rust_external_result.rc }}.
      {{ run_benchmarks_compiler_rust_external_result.stderr | default('') | truncate(300) | trim }}
  when:
    - run_benchmarks_compiler_rust_external_result is not skipped
    - run_benchmarks_compiler_rust_external_result.rc | default(0) != 0

- name: Create Go benchmark directory
  ansible.builtin.file:
    path: "{{ run_benchmarks_work_dir }}/go_bench"
    state: directory
    mode: "0755"
  when: "'go' in run_benchmarks_compilers_available.stdout"

- name: Deploy Go benchmark source
  ansible.builtin.copy:
    src: go_bench/main.go
    dest: "{{ run_benchmarks_work_dir }}/go_bench/main.go"
    mode: "0644"
  when: "'go' in run_benchmarks_compilers_available.stdout"

- name: Initialise Go module for benchmark
  ansible.builtin.command:
    cmd: go mod init bench
    chdir: "{{ run_benchmarks_work_dir }}/go_bench"
    creates: "{{ run_benchmarks_work_dir }}/go_bench/go.mod"
  changed_when: false
  failed_when: false
  when: "'go' in run_benchmarks_compilers_available.stdout"

# Discover all go1.X binaries on PATH and in common SDK cache directories.
# Deduplicates by resolved real path so a generic `go` symlink is not double-counted.
- name: Discover Go toolchains
  ansible.builtin.shell:
    cmd: |
      set +e
      set -o pipefail
      {
        # Versioned go1.X binaries on PATH
        IFS=:
        for d in $PATH; do
          [ -d "$d" ] || continue
          for f in "$d"/go1.[0-9]*; do
            [ -x "$f" ] || continue
            name=$(basename "$f")
            case "$name" in
              go1.[0-9]*) ;;
              *) continue ;;
            esac
            printf '%s %s\n' "$name" "$f"
          done
        done
        unset IFS
        # Go SDK toolchain cache (go1.21+ download-on-demand toolchains)
        for cache_dir in "${HOME}/sdk" "${HOME}/.local/share/go/toolchains" \
                          /usr/local/go/toolchains; do
          [ -d "$cache_dir" ] || continue
          for d in "$cache_dir"/go1.[0-9]*; do
            [ -d "$d" ] || continue
            gbin="$d/bin/go"
            [ -x "$gbin" ] || continue
            name=$(basename "$d")
            printf '%s %s\n' "$name" "$gbin"
          done
        done
        # Generic go last (dedup drops it if it resolves to an already-seen binary)
        full=$(command -v go 2>/dev/null) || true
        [ -n "$full" ] && printf 'go %s\n' "$full"
      } | while IFS=' ' read -r label path; do
          real=$({{ run_benchmarks_python_cmd }} -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$path" 2>/dev/null || echo "$path")
          printf '%s\t%s\t%s\n' "$real" "$label" "$path"
        done | sort -t$'\t' -k1,1 -u | awk -F'\t' '{print $2" "$3}'
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  register: run_benchmarks_go_toolchains
  changed_when: false
  failed_when: false
  when: "'go' in run_benchmarks_compilers_available.stdout"

# Resolves each Go toolchain to its full patch-level label (e.g. go1.24.1)
# and deduplicates by full version.
# stdout: "LABEL EXECUTABLE" lines for benchmark tasks
# stderr: JSON version map merged into compiler_versions.json
- name: Resolve Go toolchain versions and deduplicate
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      {{ run_benchmarks_python_cmd }} - << 'PYEOF'
      import json, re, subprocess, sys
      lines = """{{ run_benchmarks_go_toolchains.stdout | default('') }}""".strip().splitlines()
      seen: dict = {}   # full_ver → (new_label, exe, ver_string)
      for line in lines:
          parts = line.split(None, 1)
          if len(parts) < 2:
              continue
          label, exe = parts[0], parts[1]
          try:
              out = subprocess.run([exe, 'version'], capture_output=True, text=True,
                                   timeout=10, check=False)
              ver_str = (out.stdout or out.stderr).strip().splitlines()[0]
          except Exception as exc:
              ver_str = str(exc)
          m = re.search(r'go(\d+\.\d+(?:\.\d+)?)', ver_str)
          if not m:
              continue
          full_ver = m.group(1)
          if full_ver not in seen:
              new_label = f'go{full_ver}'
              seen[full_ver] = (new_label, exe, ver_str)
      version_map: dict = {}
      for full_ver, (new_label, exe, ver_str) in sorted(seen.items()):
          print(f'{new_label} {exe}')
          version_map[new_label] = ver_str
      print(json.dumps(version_map, indent=2), file=sys.stderr)
      PYEOF
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  register: run_benchmarks_go_resolved
  changed_when: false
  failed_when: false
  when: "'go' in run_benchmarks_compilers_available.stdout"

- name: Run Go compile benchmark
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      cd {{ run_benchmarks_work_dir }}/go_bench
      CMDS=()
      {% for go in run_benchmarks_go_resolved.stdout_lines | default([]) %}
      {% set go_parts = go.split() %}
      {% if go_parts | length >= 2 %}
      {% set go_label = go_parts[0] %}
      {% set go_exe = go_parts[1] %}
      if [ -x "{{ go_exe }}" ]; then
        CMDS+=(--command-name "{{ go_label }}-build"
          "{{ go_exe }} build -o bench_{{ go_label }} .")
      fi
      {% endif %}
      {% endfor %}
      if [ -z "${CMDS[*]}" ]; then
        exit 0
      fi
      {{ run_benchmarks_hyperfine_bin }} \
        --runs {{ run_benchmarks_runs }} \
        --warmup {{ run_benchmarks_warmup }} \
        --ignore-failure \
        --prepare 'rm -f bench_*' \
        --export-json {{ run_benchmarks_work_dir }}/compiler_go.json \
        "${CMDS[@]}"
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  args:
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  when: "'go' in run_benchmarks_compilers_available.stdout"
  register: run_benchmarks_compiler_go_result
  changed_when: false
  failed_when: false

- name: Warn on compiler_go benchmark failure
  ansible.builtin.debug:
    msg: >-
      [WARN] {{ inventory_hostname }}: compiler_go benchmark exited
      rc={{ run_benchmarks_compiler_go_result.rc }}.
      {{ run_benchmarks_compiler_go_result.stderr | default('') | truncate(300) | trim }}
  when:
    - run_benchmarks_compiler_go_result is not skipped
    - run_benchmarks_compiler_go_result.rc | default(0) != 0

# ---------------------------------------------------------------------------
# SQLite amalgamation compile benchmark
# ---------------------------------------------------------------------------
# Compiles sqlite3.c (~8.5 MiB, ~230 k lines) at -O0 / -O2 / -O3 with each
# available C compiler.  Typical times: gcc -O0 ~5 s, -O2 ~15 s, -O3 ~25 s.
# Uses run_benchmarks_large_compile_runs / large_compile_warmup so the total
# wall-clock time stays manageable.

- name: Copy SQLite amalgamation to work directory
  ansible.builtin.copy:
    src: "{{ run_benchmarks_fixture_dir }}/sqlite3.c"
    dest: "{{ run_benchmarks_work_dir }}/sqlite3.c"
    mode: "0644"
  register: run_benchmarks_sqlite3_copy
  changed_when: false
  failed_when: false

- name: Run SQLite amalgamation compile benchmarks
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      cd {{ run_benchmarks_work_dir }}
      CMDS=()
      {% for cc in run_benchmarks_cc_resolved.stdout_lines | default([]) %}
      {% set cc_parts = cc.split() %}
      {% if cc_parts | length >= 2 %}
      {% set cc_label = cc_parts[0] %}
      {% set cc_exe = cc_parts[1] %}
      if [ -x "{{ cc_exe }}" ]; then
        {% for opt in run_benchmarks_compiler_sqlite_opt_levels %}
        CMDS+=(--command-name "{{ cc_label }}-{{ opt | replace(' ', '_') }}"
          "{{ cc_exe }} {{ opt }} -o /dev/null -c sqlite3.c")
        {% endfor %}
      fi
      {% endif %}
      {% endfor %}
      {{ run_benchmarks_hyperfine_bin }} \
        --runs {{ run_benchmarks_large_compile_runs }} \
        --warmup {{ run_benchmarks_large_compile_warmup }} \
        --ignore-failure \
        --export-json {{ run_benchmarks_work_dir }}/compiler_sqlite.json \
        "${CMDS[@]}"
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  args:
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  when:
    - run_benchmarks_sqlite3_copy is not failed
    - run_benchmarks_sqlite3_copy.rc | default(0) == 0
    - run_benchmarks_cc_resolved.stdout_lines | default([]) | length > 0
  register: run_benchmarks_compiler_sqlite_result
  changed_when: false
  failed_when: false

- name: Warn on compiler_sqlite benchmark failure
  ansible.builtin.debug:
    msg: >-
      [WARN] {{ inventory_hostname }}: compiler_sqlite benchmark exited
      rc={{ run_benchmarks_compiler_sqlite_result.rc }}.
      {{ run_benchmarks_compiler_sqlite_result.stderr | default('') | truncate(300) | trim }}
  when:
    - run_benchmarks_compiler_sqlite_result is not skipped
    - run_benchmarks_compiler_sqlite_result.rc | default(0) != 0

# ---------------------------------------------------------------------------
# Multi-file C project compile benchmark
# ---------------------------------------------------------------------------
# Generates a 30-module project (~5 800 lines) and benchmarks sequential
# (-j 1) vs parallel (-j NPROC) make with each available C compiler.
# Uses run_benchmarks_large_compile_runs / large_compile_warmup.

- name: Generate multi-file C benchmark project
  ansible.builtin.script:
    cmd: >-
      generate_multifile_bench.py
      {{ run_benchmarks_work_dir }}/multifile_project
    creates: "{{ run_benchmarks_work_dir }}/multifile_project/Makefile"
    executable: "{{ run_benchmarks_python_cmd }}"
  changed_when: false
  failed_when: false
  register: run_benchmarks_multifile_gen

- name: Check make availability for compiler_multifile
  ansible.builtin.shell:
    cmd: command -v make >/dev/null 2>&1
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  register: run_benchmarks_compiler_multifile_make_check
  changed_when: false
  failed_when: run_benchmarks_compiler_multifile_make_check.rc != 0
  when:
    - run_benchmarks_multifile_gen is not failed
    - run_benchmarks_multifile_gen.rc | default(1) == 0

- name: Warn when multi-file C benchmark project generation failed
  ansible.builtin.debug:
    msg: >-
      [WARN] {{ inventory_hostname }}: generate_multifile_bench.py exited
      rc={{ run_benchmarks_multifile_gen.rc | default(-1) }};
      compiler_multifile benchmark will be skipped.
      {{ run_benchmarks_multifile_gen.stderr | default('') | truncate(200) | trim }}
  when:
    - run_benchmarks_multifile_gen is not failed
    - run_benchmarks_multifile_gen.rc | default(1) != 0

- name: Warn when no resolved C compilers found for compiler_multifile
  ansible.builtin.debug:
    msg: >-
      [WARN] {{ inventory_hostname }}: no resolved C compilers found;
      compiler_multifile benchmark will be skipped.
      Check that gcc or clang is installed and discoverable.
  when:
    - run_benchmarks_multifile_gen is not failed
    - run_benchmarks_multifile_gen.rc | default(1) == 0
    - run_benchmarks_cc_resolved.stdout_lines | default([]) | length == 0

- name: Run multi-file C project compile benchmarks
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      PROJ={{ run_benchmarks_work_dir }}/multifile_project
      NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
      CMDS=()
      {% for cc in run_benchmarks_cc_resolved.stdout_lines | default([]) %}
      {% set cc_parts = cc.split() %}
      {% if cc_parts | length >= 2 %}
      {% set cc_label = cc_parts[0] %}
      {% set cc_exe = cc_parts[1] %}
      if [ -x "{{ cc_exe }}" ]; then
        LINK_TEST_C="$PROJ/.link_check_{{ cc_label }}.c"
        LINK_TEST_BIN="$PROJ/.link_check_{{ cc_label }}"
        printf 'int main(void){return 0;}\n' > "$LINK_TEST_C"
        if "{{ cc_exe }}" -O2 -o "$LINK_TEST_BIN" "$LINK_TEST_C" >/dev/null 2>&1; then
          CMDS+=(
            --command-name "{{ cc_label }}-j1"
              "(cd $PROJ && make clean -s && make CC={{ cc_exe }} CFLAGS=-O2 -j 1 -s)"
            --command-name "{{ cc_label }}-jN"
              "(cd $PROJ && make clean -s && make CC={{ cc_exe }} CFLAGS=-O2 -j ${NPROC} -s)"
          )
        else
          echo "Skipping {{ cc_label }} for compiler_multifile: linker probe failed" >&2
        fi
        rm -f "$LINK_TEST_C" "$LINK_TEST_BIN"
      fi
      {% endif %}
      {% endfor %}
      if [ -z "${CMDS[*]}" ]; then
        echo "No link-capable C compilers detected for compiler_multifile benchmark" >&2
        exit 1
      fi
      {{ run_benchmarks_hyperfine_bin }} \
        --runs {{ run_benchmarks_large_compile_runs }} \
        --warmup {{ run_benchmarks_large_compile_warmup }} \
        --export-json {{ run_benchmarks_work_dir }}/compiler_multifile.json \
        "${CMDS[@]}"
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  args:
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  when:
    - run_benchmarks_multifile_gen is not failed
    - run_benchmarks_multifile_gen.rc | default(1) == 0
    - run_benchmarks_cc_resolved.stdout_lines | default([]) | length > 0
  register: run_benchmarks_compiler_multifile_result
  changed_when: false
  failed_when: false

- name: Diagnose compiler_multifile benchmark failure
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      PROJ={{ run_benchmarks_work_dir }}/multifile_project
      CC_EXE="{{ ((run_benchmarks_cc_resolved.stdout_lines | default([]) | first | default('cc')).split() | last) }}"
      (cd "$PROJ" && make clean && make CC="$CC_EXE" CFLAGS=-O2 -j 1)
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  args:
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  register: run_benchmarks_compiler_multifile_diag_result
  changed_when: false
  failed_when: false
  when:
    - run_benchmarks_compiler_multifile_result is not skipped
    - run_benchmarks_compiler_multifile_result.rc | default(0) != 0

- name: Write compiler_multifile failure artifact
  ansible.builtin.copy:
    dest: "{{ run_benchmarks_work_dir }}/compiler_multifile_failure.json"
    content: >-
      {{
        {
          'benchmark': 'compiler_multifile',
          'status': 'failed',
          'message': run_benchmarks_compiler_multifile_result.stderr | default(''),
          'rc': run_benchmarks_compiler_multifile_result.rc | default(-1),
          'failed_command': run_benchmarks_compiler_multifile_result.cmd | default(''),
          'diagnostic_command': run_benchmarks_compiler_multifile_diag_result.cmd | default(''),
          'diagnostic_rc': run_benchmarks_compiler_multifile_diag_result.rc | default(-1),
          'diagnostic_stdout': run_benchmarks_compiler_multifile_diag_result.stdout | default(''),
          'diagnostic_stderr': run_benchmarks_compiler_multifile_diag_result.stderr | default('')
        } | to_nice_json
      }}
    mode: "0644"
  changed_when: false
  failed_when: false
  when:
    - run_benchmarks_compiler_multifile_result is not skipped
    - run_benchmarks_compiler_multifile_result.rc | default(0) != 0

- name: Fail compiler_multifile benchmark on command error
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }}: compiler_multifile benchmark command failed
      (rc={{ run_benchmarks_compiler_multifile_result.rc | default(-1) }}).
      Diagnostic stderr:
      {{ run_benchmarks_compiler_multifile_diag_result.stderr
         | default(run_benchmarks_compiler_multifile_result.stderr | default(''))
         | truncate(500)
         | trim }}
  when:
    - run_benchmarks_compiler_multifile_result is not skipped
    - run_benchmarks_compiler_multifile_result.rc | default(0) != 0

- name: Validate compiler_multifile exit codes
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      {{ run_benchmarks_python_cmd }} - <<'PY'
      import json
      from pathlib import Path

      results_file = Path("{{ run_benchmarks_work_dir }}/compiler_multifile.json")
      data = json.loads(results_file.read_text(encoding="utf-8"))
      non_zero_exit_codes = []
      for entry in data.get("results", []):
          for exit_code in entry.get("exit_codes", []):
              if exit_code != 0:
                  non_zero_exit_codes.append((entry.get("command", "unknown"), exit_code))
      if non_zero_exit_codes:
          formatted = ", ".join(
              f"{command_name}:{exit_code}" for command_name, exit_code in non_zero_exit_codes
          )
          raise SystemExit(f"non-zero exit codes in compiler_multifile: {formatted}")
      PY
    executable: "{{ _run_benchmarks_bash | default('/bin/bash') }}"
  changed_when: false
  when:
    - run_benchmarks_compiler_multifile_result is not skipped
    - run_benchmarks_compiler_multifile_result.rc | default(1) == 0
