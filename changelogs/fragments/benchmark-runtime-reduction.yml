minor_changes:
  - "run_benchmarks: reduced runtime of heavy benchmark sections by lowering default rounds for compression and FFmpeg video, and by adding dedicated OpenSSL/SSH asymmetric tuning defaults (3 runs, 1 warmup, 500 inner-loop iterations)."
